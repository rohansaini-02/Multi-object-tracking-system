[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mot-ml"
version = "0.1.0"
description = "Standalone Multi-Object Tracking (DeepSORT + YOLOv8) ML module"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "motmetrics>=1.4.0",
]

[project.scripts]
mot-cli = "ml.cli:main"
